name: Refresh release data and the v3 API reference

on:
  # @nonobvious(must-hold) the product repository runs no workflow that could notify this one, so this
  # schedule is the only path by which an upstream release reaches the site; weekly was too slow once
  # it stopped being a backstop and became the mechanism
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v5

      - name: Check out the source repository
        uses: actions/checkout@v5
        with:
          repository: lujstn/openbrowse
          path: .upstream

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the app so its OpenAPI schema can be read
        working-directory: .upstream
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Regenerate the pruned v3 spec
        run: |
          python scripts/generate-openapi.py \
            --repo .upstream \
            --python "$(which python)" \
            -o data/openapi.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Synchronise benchmark measurements
        run: npm run sync:upstream
        env:
          OPENBROWSE_README: .upstream/README.md

      - name: Regenerate the reference pages
        run: node scripts/generate-api-docs.mjs

      # @nonobvious(must-hold) read from the checkout rather than the default raw.githubusercontent URL,
      # so the version this PR publishes is the one from the very tree the spec above was generated from
      - name: Refresh the published release metadata
        run: node scripts/sync-citation.mjs
        env:
          OPENBROWSE_CFF: .upstream/CITATION.cff

      - name: Verify upstream data and documented application facts
        run: |
          npm run check:upstream
          npm run check:facts
        env:
          OPENBROWSE_README: .upstream/README.md
          OPENBROWSE_REPO: .upstream

      - name: Raise a pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Refresh release data and the v3 API reference"
          title: "Refresh release data and the v3 API reference"
          body: |
            OpenBrowse changed upstream, so its release metadata, benchmark
            measurements, API specification and generated reference pages have
            been synchronised.

            Generated by `.github/workflows/refresh-openapi.yml`. Review the
            diff before merging: benchmark result-count changes still require
            manual review, and a removed endpoint is a breaking change for
            anyone following these docs.
          branch: refresh/release-data
          delete-branch: true
          add-paths: |
            data/openapi.json
            data/release.json
            data/benchmarks.json
            content/docs/api
